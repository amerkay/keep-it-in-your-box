<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Security Audit of the kib Claude Code Docker sandbox. Six host-RCE paths found and closed, zero container escapes. A terminal pane shows a host-RCE attempt refused with EACCES.">
  <title>Security Audit — kib Claude Code Docker sandbox: 6 host-RCE paths found and closed, 0 container escapes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- ── left: title + verdict ─────────────────────────────────────────── -->
  <text x="64" y="112" class="mono" font-size="17" letter-spacing="3.5" fill="#58a6ff">kib &#183; CLAUDE CODE DOCKER SANDBOX</text>

  <text x="61" y="192" class="sans" font-size="76" font-weight="800" fill="#e6edf3" letter-spacing="-1">Security Audit</text>

  <text x="64" y="236" class="sans" font-size="23" fill="#adbac7">Can a malicious repo run code on your host?</text>

  <g class="mono" font-weight="700">
    <rect x="64" y="266" width="470" height="46" rx="23" fill="#0f2417" stroke="#238636" stroke-width="1.5"/>
    <path d="M92 289 l7 8 l13 -16" fill="none" stroke="#3fb950" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- textLength pins the string inside the pill whichever mono face resolves. -->
    <text x="126" y="295" font-size="18" fill="#56d364" textLength="380" lengthAdjust="spacingAndGlyphs">6 HOST-RCE PATHS &#8212; ALL CLOSED</text>
  </g>

  <!-- ── right: proof terminal ────────────────────────────────────────── -->
  <g>
    <rect x="660" y="112" width="476" height="176" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <path d="M660 146 H1136" stroke="#21262d" stroke-width="1.5"/>
    <circle cx="684" cy="129" r="5" fill="#30363d"/>
    <circle cx="702" cy="129" r="5" fill="#30363d"/>
    <circle cx="720" cy="129" r="5" fill="#30363d"/>

    <g class="mono" font-size="16">
      <text x="684" y="188" fill="#8b949e">$ <tspan fill="#adbac7">git config core.fsmonitor ./pwn.sh</tspan></text>
      <text x="684" y="216" fill="#3fb950">&#10003; refused &#183; EACCES</text>
      <text x="684" y="262" fill="#6e7681"># host `git status` &#8594; nothing to execute</text>
    </g>
  </g>
</svg>
