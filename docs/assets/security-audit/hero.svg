<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
  <title id="t">Security Audit — kib Claude Code Docker sandbox: 13 host-RCE paths found and closed, 0 container escapes</title>
  <desc id="d">Security audit of the kib Claude Code Docker sandbox, across three passes on two host platforms. Thirteen host-RCE paths were found by live exploitation and all thirteen are now closed: six in the first Linux pass, two in the second, five in the macOS pass. Twenty-two findings in total, seven Critical and eleven High. Zero container escapes were reproduced. A terminal pane shows two git-config attacks refused by the guard, an fsmonitor write refused with EACCES and a leading-BOM parser bypass refused as an ambiguous entry, leaving the host's own git status with nothing to execute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)"/>

  <!-- ── left: title + verdict ─────────────────────────────────────────── -->
  <text x="64" y="92" class="mono" font-size="17" letter-spacing="3.5" fill="#58a6ff">kib &#183; CLAUDE CODE DOCKER SANDBOX</text>

  <text x="61" y="172" class="sans" font-size="76" font-weight="800" fill="#e6edf3" letter-spacing="-1">Security Audit</text>

  <text x="64" y="214" class="sans" font-size="23" fill="#adbac7">Can a malicious repo run code on your host?</text>

  <g class="mono" font-weight="700">
    <rect x="64" y="244" width="470" height="46" rx="23" fill="#0f2417" stroke="#238636" stroke-width="1.5"/>
    <path d="M92 267 l7 8 l13 -16" fill="none" stroke="#3fb950" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- textLength pins the string inside the pill whichever mono face resolves. -->
    <text x="126" y="273" font-size="18" fill="#56d364" textLength="380" lengthAdjust="spacingAndGlyphs">13 HOST-RCE PATHS &#8212; ALL CLOSED</text>
  </g>

  <!-- ── left: stat strip · counts are the canonical findings table ───── -->
  <g stroke="#8b949e" stroke-opacity="0.18" stroke-width="1">
    <path d="M186 332 V378"/><path d="M306 332 V378"/><path d="M406 332 V378"/>
  </g>
  <g class="sans" font-size="28" font-weight="800" fill="#e6edf3">
    <text x="64" y="358">22</text>
    <text x="206" y="358">7</text>
    <text x="326" y="358">11</text>
    <text x="426" y="358">0</text>
  </g>
  <g class="mono" font-size="13" letter-spacing="1.5" fill="#8b949e">
    <text x="64" y="378">FINDINGS</text>
    <text x="206" y="378">CRITICAL</text>
    <text x="326" y="378">HIGH</text>
    <text x="426" y="378">CONTAINER ESCAPES</text>
  </g>

  <!-- ── right: proof terminal ────────────────────────────────────────── -->
  <g>
    <rect x="660" y="100" width="476" height="216" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <path d="M660 134 H1136" stroke="#21262d" stroke-width="1.5"/>
    <circle cx="684" cy="117" r="5" fill="#30363d"/>
    <circle cx="702" cy="117" r="5" fill="#30363d"/>
    <circle cx="720" cy="117" r="5" fill="#30363d"/>

    <g class="mono" font-size="15">
      <text x="684" y="170" fill="#8b949e">$ <tspan fill="#adbac7">git config core.fsmonitor ./pwn.sh</tspan></text>
      <text x="684" y="196" fill="#3fb950">&#10003; refused &#183; EACCES</text>
      <!-- <BOM> spelled out: a literal U+FEFF renders zero-width and loses the point. -->
      <text x="684" y="232" fill="#8b949e">$ <tspan fill="#adbac7">printf '&lt;BOM&gt;[core]fsmonitor=x' &gt;cfg</tspan></text>
      <text x="684" y="258" fill="#3fb950">&#10003; refused &#183; AMBIGUOUS_ENTRY</text>
      <text x="684" y="294" fill="#6e7681"># host `git status` &#8594; nothing to execute</text>
    </g>
  </g>
</svg>
