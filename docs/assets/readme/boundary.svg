<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">What crosses the box boundary</title>
  <desc id="bdesc">At the box boundary: .env and .kibignore read as key names with every value replaced and writes refused; .git/config is validated so hooks, aliases and ssh keys are refused while ordinary keys pass; clipboard writes arrive as plain text while reads pass through; API keys appear only as a placeholder because the broker holds the real key; your project code stays read and write.</desc>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .ico  { fill: none; stroke: #3fb950; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="16" y="16" width="1168" height="398" rx="20" fill="#0b0f14"/>
  <rect x="16" y="16" width="1168" height="398" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- header -->
  <g class="mono">
    <text x="48" y="62" font-size="23" fill="#3fb950">$</text>
    <text x="72" y="62" font-size="23" fill="#e6edf3">at the box boundary</text>
    <text x="48" y="92" font-size="18" fill="#8b949e">the box answers instead of just blocking &#8212; the workflow keeps working</text>
  </g>

  <!-- 1. secrets -->
  <g transform="translate(0 114)">
    <rect x="48" y="0" width="1104" height="50" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <g class="ico" transform="translate(80 25)">
      <rect x="-8" y="-2" width="16" height="12" rx="2"/>
      <path d="M-4 -2 v-4 a4 4 0 0 1 8 0 v4"/>
    </g>
    <text x="112" y="32" class="mono" font-size="20" fill="#e6edf3">.env &#183; .kibignore</text>
    <line x1="470" y1="12" x2="470" y2="38" stroke="#30363d" stroke-width="1.5"/>
    <text x="502" y="32" class="mono" font-size="20" fill="#c9d1d9"><tspan fill="#3fb950">keys, not values</tspan> &#8212; writes refused</text>
  </g>

  <!-- 2. host-executed git config -->
  <g transform="translate(0 172)">
    <rect x="48" y="0" width="1104" height="50" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <g class="ico" transform="translate(80 25)">
      <path d="M0 -10 l9 3.5 v6.5 c0 5.5 -4.5 8.5 -9 10 c-4.5 -1.5 -9 -4.5 -9 -10 v-6.5 z"/>
      <path d="M-4.5 0 l3 3 l6 -6.5"/>
    </g>
    <text x="112" y="32" class="mono" font-size="20" fill="#e6edf3">.git/config</text>
    <line x1="470" y1="12" x2="470" y2="38" stroke="#30363d" stroke-width="1.5"/>
    <text x="502" y="32" class="mono" font-size="20" fill="#c9d1d9"><tspan fill="#3fb950">validated</tspan> &#8212; hooks, alias, ssh keys refused</text>
  </g>

  <!-- 3. clipboard -->
  <g transform="translate(0 230)">
    <rect x="48" y="0" width="1104" height="50" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <g class="ico" transform="translate(80 25)">
      <path d="M-9 -8 h18 l-7 8.5 v9.5 l-4 -2.5 v-7 z"/>
    </g>
    <text x="112" y="32" class="mono" font-size="20" fill="#e6edf3">clipboard write</text>
    <line x1="470" y1="12" x2="470" y2="38" stroke="#30363d" stroke-width="1.5"/>
    <text x="502" y="32" class="mono" font-size="20" fill="#c9d1d9"><tspan fill="#3fb950">plain text only</tspan> &#8212; reads pass through</text>
  </g>

  <!-- 4. credentials -->
  <g transform="translate(0 288)">
    <rect x="48" y="0" width="1104" height="50" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <g class="ico" transform="translate(80 25)">
      <circle cx="-5" cy="0" r="4.5"/>
      <path d="M-0.5 0 h10.5 M6 0 v5 M9.5 0 v5"/>
    </g>
    <text x="112" y="32" class="mono" font-size="20" fill="#e6edf3">API keys &#183; tokens</text>
    <line x1="470" y1="12" x2="470" y2="38" stroke="#30363d" stroke-width="1.5"/>
    <text x="502" y="32" class="mono" font-size="20" fill="#c9d1d9"><tspan fill="#3fb950">placeholder</tspan> &#8212; the broker holds the real key</text>
  </g>

  <!-- 5. the project itself -->
  <g transform="translate(0 346)">
    <rect x="48" y="0" width="1104" height="50" rx="12" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
    <g class="ico" transform="translate(80 25)">
      <path d="M-9 9 l1.5 -5.5 l10 -10 l4 4 l-10 10 z"/>
      <path d="M2.5 -8 l4 4"/>
    </g>
    <text x="112" y="32" class="mono" font-size="20" fill="#e6edf3">your project code</text>
    <line x1="470" y1="12" x2="470" y2="38" stroke="#30363d" stroke-width="1.5"/>
    <text x="502" y="32" class="mono" font-size="20" fill="#c9d1d9"><tspan fill="#3fb950">read + write</tspan> &#8212; that part is the job</text>
  </g>
</svg>
