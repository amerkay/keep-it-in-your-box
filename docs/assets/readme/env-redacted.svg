<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="rtitle rdesc">
  <title id="rtitle">The same file, two answers</title>
  <desc id="rdesc">Running cat .env on the host prints real values such as STRIPE_KEY, DATABASE_URL, OPENAI_API_KEY and SESSION_SECRET. The same command inside the kib sandbox prints the same key names with every value replaced by the word redacted. Writes to the file are refused, the rule covers files created after launch, and dotenv, JSON and YAML are all recognised.</desc>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>

  <rect x="16" y="16" width="1168" height="368" rx="20" fill="#0b0f14"/>
  <rect x="16" y="16" width="1168" height="368" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- one command, run on both sides -->
  <g class="mono">
    <text x="56" y="64" font-size="23" fill="#3fb950">$</text>
    <text x="80" y="64" font-size="23" fill="#e6edf3">cat .env</text>
  </g>

  <!-- column labels -->
  <g class="mono" font-size="16" letter-spacing="2" fill="#8b949e">
    <text x="56" y="102">YOU, ON THE HOST</text>
    <text x="624" y="102">THE AGENT, IN THE BOX</text>
  </g>

  <!-- host pane: real values -->
  <rect x="56" y="118" width="520" height="200" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <g class="mono" font-size="20" fill="#c9d1d9">
    <text x="80" y="158">STRIPE_KEY=<tspan fill="#e3b341">sk_live_51H8xQ2Rb&#8230;</tspan></text>
    <text x="80" y="194">DATABASE_URL=<tspan fill="#e3b341">postgres://app:pw@db/prod</tspan></text>
    <text x="80" y="230">OPENAI_API_KEY=<tspan fill="#e3b341">sk-proj-9fA2kD&#8230;</tspan></text>
    <text x="80" y="266">SESSION_SECRET=<tspan fill="#e3b341">b7d41f0c9e2a&#8230;</tspan></text>
  </g>

  <!-- the boundary -->
  <line x1="600" y1="118" x2="600" y2="318" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 6" opacity="0.7"/>

  <!-- box pane: keys, no values -->
  <rect x="624" y="118" width="520" height="200" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <g class="mono" font-size="20" fill="#c9d1d9">
    <text x="648" y="158">STRIPE_KEY=<tspan fill="#3fb950">&#60;redacted&#62;</tspan></text>
    <text x="648" y="194">DATABASE_URL=<tspan fill="#3fb950">&#60;redacted&#62;</tspan></text>
    <text x="648" y="230">OPENAI_API_KEY=<tspan fill="#3fb950">&#60;redacted&#62;</tspan></text>
    <text x="648" y="266">SESSION_SECRET=<tspan fill="#3fb950">&#60;redacted&#62;</tspan></text>
  </g>

  <text x="600" y="356" class="mono" text-anchor="middle" font-size="19" fill="#8b949e">writes refused &#183; covers files created after launch &#183; dotenv, JSON and YAML</text>
</svg>
