<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">Where your keys actually live</title>
  <desc id="bdesc">The sandbox holds only a placeholder token and a base URL pointing at the broker. The broker sidecar, which runs with cap-drop equals ALL, strips the placeholder and injects the real credential on the way out to api.anthropic.com or your own MCP or REST route. The real key is stored host-side at ~/.keep-it-in-your-box, mode 600, in a directory the sandbox never mounts.</desc>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1168" height="368" rx="20" fill="#0b0f14"/>
  <rect x="16" y="16" width="1168" height="368" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <g class="mono">
    <text x="56" y="60" font-size="23" fill="#3fb950">$</text>
    <text x="80" y="60" font-size="23" fill="#e6edf3">where your keys actually live</text>
    <text x="56" y="92" font-size="19" fill="#8b949e">the real credential is added on the way out &#8212; outside the sandbox</text>
  </g>

  <!-- 1. the sandbox: placeholder only -->
  <rect x="56" y="118" width="320" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="80" y="148" class="mono" font-size="16" letter-spacing="2" fill="#8b949e">THE BOX</text>
  <g class="mono" font-size="20">
    <text x="80" y="184" fill="#e6edf3">placeholder token</text>
    <text x="80" y="216" fill="#8b949e">fake_value_&#8230;</text>
  </g>

  <line x1="376" y1="178" x2="432" y2="178" stroke="#3fb950" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2. the broker sidecar: swaps it -->
  <rect x="440" y="118" width="320" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="464" y="148" class="mono" font-size="16" letter-spacing="2" fill="#3fb950">BROKER &#183; cap-drop=ALL</text>
  <g class="mono" font-size="20">
    <text x="464" y="184" fill="#e6edf3">strips placeholder</text>
    <text x="464" y="216" fill="#e6edf3">injects the real key</text>
  </g>

  <line x1="760" y1="178" x2="816" y2="178" stroke="#3fb950" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3. upstream -->
  <rect x="824" y="118" width="320" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="848" y="148" class="mono" font-size="16" letter-spacing="2" fill="#8b949e">UPSTREAM</text>
  <g class="mono" font-size="20">
    <text x="848" y="184" fill="#e6edf3">api.anthropic.com</text>
    <text x="848" y="216" fill="#e6edf3">your MCP or REST route</text>
  </g>

  <!-- the key store feeding the broker, host-side -->
  <line x1="600" y1="290" x2="600" y2="246" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="380" y="290" width="440" height="78" rx="12" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <g transform="translate(412 326)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#e3b341" stroke-width="3"/>
    <path d="M7 0 h17 M18 0 v7 M24 0 v7" stroke="#e3b341" stroke-width="3" fill="none"/>
  </g>
  <g class="mono">
    <text x="452" y="322" font-size="19" fill="#e6edf3">~/.keep-it-in-your-box/</text>
    <text x="452" y="348" font-size="17" fill="#8b949e">mode 600 &#183; never mounted</text>
  </g>
</svg>
