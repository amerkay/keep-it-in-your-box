<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 434" width="1200" height="434" role="img" aria-labelledby="t d">
  <title id="t">Sandbox Comparison — kib measured against 30 open-source agent sandboxes</title>
  <desc id="d">kib leads on 5 containment controls and is behind on 2. A scorecard shows how many of the 30 surveyed projects share each control: clipboard mediation 0, in-project secret redaction 3, host-config guard 4, credential brokering 5, workspace confinement (host home directory out of reach) 11, default-deny egress 10.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="434" fill="url(#bg)"/>
  <rect width="1200" height="434" fill="url(#grid)"/>

  <!-- ── left: title + verdict ─────────────────────────────────────────── -->
  <g id="title-block" transform="translate(0,17)">
    <text x="64" y="112" class="mono" font-size="17" letter-spacing="3.5" fill="#58a6ff">kib &#183; CLAUDE CODE DOCKER SANDBOX</text>

    <text x="61" y="188" class="sans" font-size="58" font-weight="800" fill="#e6edf3" letter-spacing="-1">Sandbox Comparison</text>

    <text x="64" y="232" class="sans" font-size="22" fill="#adbac7">30 open-source agent sandboxes, measured against kib.</text>

    <g class="mono" font-weight="700">
      <rect x="64" y="278" width="286" height="44" rx="22" fill="#0f2417" stroke="#238636" stroke-width="1.5"/>
      <path d="M92 300 l7 8 l13 -16" fill="none" stroke="#3fb950" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="306" font-size="17" fill="#56d364" textLength="206" lengthAdjust="spacingAndGlyphs">LEADS ON 5 CONTROLS</text>

      <rect x="366" y="278" width="212" height="44" rx="22" fill="#2d1214" stroke="#da3633" stroke-width="1.5"/>
      <path d="M392 294 l14 14 M406 294 l-14 14" fill="none" stroke="#f85149" stroke-width="3.4" stroke-linecap="round"/>
      <text x="422" y="306" font-size="17" fill="#ff7b72" textLength="134" lengthAdjust="spacingAndGlyphs">BEHIND ON 2</text>
    </g>
  </g>

  <!-- ── right: adoption scorecard ─────────────────────────────────────── -->
  <g id="scorecard">
    <rect x="660" y="98" width="476" height="280" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

    <g class="mono" font-size="15" letter-spacing="1.6" fill="#6e7681">
      <text x="684" y="132">CONTROL</text>
      <text x="1112" y="132" text-anchor="end">OTHERS OF 30</text>
    </g>
    <path d="M684 146 H1112" stroke="#21262d" stroke-width="1.5"/>

    <g font-size="18">
      <circle cx="692" cy="184" r="4.5" fill="#3fb950"/>
      <text x="710" y="190" class="sans" fill="#adbac7">Clipboard mediation</text>
      <text x="1112" y="190" class="mono" font-weight="700" fill="#56d364" text-anchor="end">0</text>

      <circle cx="692" cy="218" r="4.5" fill="#3fb950"/>
      <text x="710" y="224" class="sans" fill="#adbac7">In-project redaction</text>
      <text x="1112" y="224" class="mono" font-weight="700" fill="#56d364" text-anchor="end">3</text>

      <circle cx="692" cy="252" r="4.5" fill="#3fb950"/>
      <text x="710" y="258" class="sans" fill="#adbac7">Host-config guard</text>
      <text x="1112" y="258" class="mono" font-weight="700" fill="#56d364" text-anchor="end">4</text>

      <circle cx="692" cy="286" r="4.5" fill="#3fb950"/>
      <text x="710" y="292" class="sans" fill="#adbac7">Credential brokering</text>
      <text x="1112" y="292" class="mono" font-weight="700" fill="#56d364" text-anchor="end">5</text>

      <circle cx="692" cy="320" r="4.5" fill="#3fb950"/>
      <text x="710" y="326" class="sans" fill="#adbac7">Workspace confinement</text>
      <text x="1112" y="326" class="mono" font-weight="700" fill="#56d364" text-anchor="end">11</text>

      <circle cx="692" cy="354" r="4.5" fill="#f85149"/>
      <text x="710" y="360" class="sans" fill="#adbac7">Default-deny egress</text>
      <text x="1112" y="360" class="mono" font-weight="700" fill="#ff7b72" text-anchor="end">10</text>
    </g>
  </g>
</svg>
