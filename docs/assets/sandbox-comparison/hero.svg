<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 434" width="1200" height="434" role="img" aria-labelledby="t d">
  <title id="t">Sandbox Comparison — kib measured against 30 open-source agent sandboxes</title>
  <desc id="d">kib leads on 5 containment controls and holds 3 deliberate minority positions. A scorecard shows how many of the 30 surveyed projects share each control: clipboard mediation 0, in-project secret redaction 6, VM-class boundary 6, default-deny egress 7, host-executed config guard 10. kib has clipboard mediation, in-project redaction and the host-executed config guard; it declines a VM-class boundary and default-deny egress by design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="434" fill="url(#bg)"/>
  <rect width="1200" height="434" fill="url(#grid)"/>

  <!-- ── left: title + verdict ─────────────────────────────────────────── -->
  <g id="title-block" transform="translate(0,17)">
    <text x="64" y="112" class="mono" font-size="18" letter-spacing="3.5" fill="#58a6ff">kib &#183; CLAUDE CODE DOCKER SANDBOX</text>

    <text x="61" y="188" class="sans" font-size="58" font-weight="800" fill="#e6edf3" letter-spacing="-1">Sandbox Comparison</text>

    <text x="64" y="232" class="sans" font-size="22" fill="#adbac7">30 open-source agent sandboxes, measured against kib.</text>

    <g class="mono" font-weight="700">
      <rect x="64" y="278" width="262" height="44" rx="22" fill="#0f2417" stroke="#238636" stroke-width="1.5"/>
      <path d="M90 300 l7 8 l13 -16" fill="none" stroke="#3fb950" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="118" y="306" font-size="18" fill="#56d364" textLength="192" lengthAdjust="spacingAndGlyphs">LEADS ON 5 CONTROLS</text>

      <rect x="342" y="278" width="228" height="44" rx="22" fill="#2b2213" stroke="#9e6a03" stroke-width="1.5"/>
      <rect x="368" y="298" width="18" height="4" rx="2" fill="#e3b341"/>
      <text x="398" y="306" font-size="18" fill="#e3b341" textLength="158" lengthAdjust="spacingAndGlyphs">3 GAPS BY DESIGN</text>
    </g>
  </g>

  <!-- ── right: adoption scorecard ─────────────────────────────────────── -->
  <g id="scorecard">
    <rect x="660" y="98" width="476" height="280" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

    <g class="mono" font-size="15" letter-spacing="1.6" fill="#6e7681">
      <text x="684" y="132">CONTROL</text>
      <text x="1112" y="132" text-anchor="end">OTHERS OF 30</text>
    </g>
    <path d="M684 146 H1112" stroke="#21262d" stroke-width="1.5"/>

    <!-- leads: full-contrast -->
    <g font-size="18">
      <circle cx="692" cy="178" r="4.5" fill="#3fb950"/>
      <text x="710" y="184" class="sans" fill="#adbac7">Clipboard mediation</text>
      <text x="1112" y="184" class="mono" font-weight="700" fill="#56d364" text-anchor="end">0</text>

      <circle cx="692" cy="212" r="4.5" fill="#3fb950"/>
      <text x="710" y="218" class="sans" fill="#adbac7">In-project redaction</text>
      <text x="1112" y="218" class="mono" font-weight="700" fill="#56d364" text-anchor="end">6</text>

      <circle cx="692" cy="246" r="4.5" fill="#3fb950"/>
      <text x="710" y="252" class="sans" fill="#adbac7">Host-config guard</text>
      <text x="1112" y="252" class="mono" font-weight="700" fill="#56d364" text-anchor="end">10</text>
    </g>

    <!-- declined by design: subordinate -->
    <path d="M684 274 H1112" stroke="#21262d" stroke-width="1.5"/>
    <text x="684" y="296" class="mono" font-size="14" letter-spacing="1.6" fill="#9e6a03">DECLINED BY DESIGN</text>

    <g font-size="18" opacity="0.62">
      <rect x="687.5" y="316" width="9" height="3" rx="1.5" fill="#e3b341"/>
      <text x="710" y="324" class="sans" fill="#8b949e">VM-class boundary</text>
      <text x="1112" y="324" class="mono" font-weight="700" fill="#e3b341" text-anchor="end">6</text>

      <rect x="687.5" y="350" width="9" height="3" rx="1.5" fill="#e3b341"/>
      <text x="710" y="358" class="sans" fill="#8b949e">Default-deny egress</text>
      <text x="1112" y="358" class="mono" font-weight="700" fill="#e3b341" text-anchor="end">7</text>
    </g>
  </g>
</svg>
