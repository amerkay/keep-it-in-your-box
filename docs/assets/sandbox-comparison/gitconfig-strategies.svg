<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t2 d2">
  <title id="t2">Four strategies for the .git/config problem</title>
  <desc id="d2">How six sandboxes handle a git config file the host will later execute. kib validates the content, allowing git remote add while refusing core.hooksPath. fence, sandbox-runtime, aicontainer and cplt on macOS block all writes, which breaks git remote add. yoloAI leaves the file writable but hardens every git invocation with core.hooksPath=/dev/null. cplt on Linux leaves it writable by design, and its own docs concede this leaves core.hooksPath open.</desc>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="gridg" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#bgg)"/>
  <rect width="1200" height="600" fill="url(#gridg)"/>

  <text x="64" y="70" class="mono" font-size="15" letter-spacing="3.2" fill="#58a6ff">THE HOST-EXECUTED CONFIG PROBLEM</text>
  <text x="62" y="116" class="sans" font-size="34" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">Four answers to one file</text>
  <text x="64" y="150" class="sans" font-size="20" fill="#8b949e">A sandbox writes <tspan class="mono" fill="#adbac7">.git/config</tspan>. The host runs what it says, later, unsandboxed.</text>

  <!-- ── row 1: VALIDATE ───────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="190" width="1072" height="88" rx="10" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
    <rect x="64" y="190" width="5" height="88" rx="2.5" fill="#3fb950"/>
    <text x="96" y="224" class="mono" font-size="19" font-weight="700" fill="#56d364">VALIDATE</text>
    <text x="96" y="256" class="sans" font-size="19" fill="#8b949e">Read the bytes on rename. Allow <tspan class="mono" fill="#adbac7">remote add</tspan>, refuse <tspan class="mono" fill="#adbac7">core.hooksPath</tspan>.</text>
    <text x="1108" y="224" class="mono" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="end">kib</text>
    <text x="1108" y="254" class="sans" font-size="17" fill="#6e7681" text-anchor="end">git keeps working</text>
  </g>

  <!-- ── row 2: BLOCK ──────────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="292" width="1072" height="88" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <rect x="64" y="292" width="5" height="88" rx="2.5" fill="#8b949e"/>
    <text x="96" y="326" class="mono" font-size="19" font-weight="700" fill="#adbac7">BLOCK</text>
    <text x="96" y="358" class="sans" font-size="19" fill="#8b949e">Deny every write to the file. No content is ever inspected.</text>
    <text x="1108" y="322" class="mono" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="end">fence &#183; sandbox-runtime</text>
    <text x="1108" y="348" class="mono" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="end">aicontainer &#183; cplt (macOS)</text>
    <text x="1108" y="372" class="sans" font-size="17" fill="#6e7681" text-anchor="end">breaks <tspan class="mono">git remote add</tspan></text>
  </g>

  <!-- ── row 3: NEUTRALIZE ─────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="394" width="1072" height="88" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <rect x="64" y="394" width="5" height="88" rx="2.5" fill="#58a6ff"/>
    <text x="96" y="428" class="mono" font-size="19" font-weight="700" fill="#79c0ff">NEUTRALIZE</text>
    <text x="96" y="460" class="sans" font-size="19" fill="#8b949e">Leave it writable. Harden every git call: <tspan class="mono" fill="#adbac7">-c core.hooksPath=/dev/null</tspan>.</text>
    <text x="1108" y="428" class="mono" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="end">yoloAI</text>
    <text x="1108" y="458" class="sans" font-size="17" fill="#6e7681" text-anchor="end">filter drivers remain</text>
  </g>

  <!-- ── row 4: LEAVE OPEN ─────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="496" width="1072" height="88" rx="10" fill="#0d1117" stroke="#da3633" stroke-width="1.5"/>
    <rect x="64" y="496" width="5" height="88" rx="2.5" fill="#f85149"/>
    <text x="96" y="530" class="mono" font-size="19" font-weight="700" fill="#ff7b72">LEAVE OPEN</text>
    <text x="96" y="562" class="sans" font-size="19" fill="#8b949e">Writable by design, so ordinary <tspan class="mono" fill="#adbac7">git config</tspan> keeps working.</text>
    <text x="1108" y="530" class="mono" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="end">cplt (Linux)</text>
    <text x="1108" y="560" class="sans" font-size="17" fill="#6e7681" text-anchor="end">documented as a residual</text>
  </g>
</svg>
