<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t2 d2">
  <title id="t2">Five strategies for the .git/config problem</title>
  <desc id="d2">How the surveyed sandboxes handle a git config file the host will later execute. kib validates the content, allowing git remote add while refusing core.hooksPath. fence, sandbox-runtime, aicontainer, cplt on macOS, claude-code-devcontainer and agent-sandbox block all writes, which breaks git remote add. yoloAI confines git, running the agent's git inside the sandbox instead of guarding the file, after a critical host RCE. container-use filters .git on export so it never leaves the environment, which does not apply in-session. cplt on Linux, agent-safehouse and the long tail leave the file writable; cplt concedes this leaves core.hooksPath open.</desc>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="gridg" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="690" fill="url(#bgg)"/>
  <rect width="1200" height="690" fill="url(#gridg)"/>

  <text x="64" y="70" class="mono" font-size="15" letter-spacing="3.2" fill="#58a6ff">THE HOST-EXECUTED CONFIG PROBLEM</text>
  <text x="62" y="116" class="sans" font-size="34" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">Five answers to one file</text>
  <text x="64" y="150" class="sans" font-size="20" fill="#8b949e">A sandbox writes <tspan class="mono" fill="#adbac7">.git/config</tspan>. The host runs what it says, later, unsandboxed.</text>

  <!-- ── row 1: VALIDATE ───────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="186" width="1072" height="84" rx="10" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
    <rect x="64" y="186" width="5" height="84" rx="2.5" fill="#3fb950"/>
    <text x="96" y="220" class="mono" font-size="19" font-weight="700" fill="#56d364">VALIDATE</text>
    <text x="96" y="250" class="sans" font-size="19" fill="#8b949e">Read the bytes on rename. Allow <tspan class="mono" fill="#adbac7">remote add</tspan>, refuse <tspan class="mono" fill="#adbac7">core.hooksPath</tspan>.</text>
    <text x="1108" y="220" class="mono" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="end">kib</text>
    <text x="1108" y="248" class="sans" font-size="17" fill="#6e7681" text-anchor="end">git keeps working</text>
  </g>

  <!-- ── row 2: BLOCK ──────────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="282" width="1072" height="84" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <rect x="64" y="282" width="5" height="84" rx="2.5" fill="#8b949e"/>
    <text x="96" y="316" class="mono" font-size="19" font-weight="700" fill="#adbac7">BLOCK</text>
    <text x="96" y="346" class="sans" font-size="19" fill="#8b949e">Deny every write to the file. No content is ever inspected.</text>
    <text x="1108" y="310" class="mono" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="end">fence &#183; sandbox-runtime &#183; aicontainer</text>
    <text x="1108" y="333" class="mono" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="end">cplt (macOS) &#183; cc-devcontainer &#183; agent-sandbox</text>
    <text x="1108" y="356" class="sans" font-size="17" fill="#6e7681" text-anchor="end">breaks <tspan class="mono">git remote add</tspan></text>
  </g>

  <!-- ── row 3: CONFINE ────────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="378" width="1072" height="84" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <rect x="64" y="378" width="5" height="84" rx="2.5" fill="#58a6ff"/>
    <text x="96" y="412" class="mono" font-size="19" font-weight="700" fill="#79c0ff">CONFINE</text>
    <text x="96" y="442" class="sans" font-size="19" fill="#8b949e">Run the agent's git inside the sandbox instead of guarding the file.</text>
    <text x="1108" y="412" class="mono" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="end">yoloAI</text>
    <text x="1108" y="440" class="sans" font-size="17" fill="#6e7681" text-anchor="end">adopted after a host RCE</text>
  </g>

  <!-- ── row 4: FILTER ON EXPORT ───────────────────────────────────────── -->
  <g>
    <rect x="64" y="474" width="1072" height="84" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <rect x="64" y="474" width="5" height="84" rx="2.5" fill="#a371f7"/>
    <text x="96" y="508" class="mono" font-size="19" font-weight="700" fill="#c297ff">FILTER ON EXPORT</text>
    <text x="96" y="538" class="sans" font-size="19" fill="#8b949e">Block <tspan class="mono" fill="#adbac7">.git</tspan> from ever leaving the environment.</text>
    <text x="1108" y="508" class="mono" font-size="21" font-weight="700" fill="#e6edf3" text-anchor="end">container-use</text>
    <text x="1108" y="536" class="sans" font-size="17" fill="#6e7681" text-anchor="end">doesn't apply in-session</text>
  </g>

  <!-- ── row 5: LEAVE OPEN ─────────────────────────────────────────────── -->
  <g>
    <rect x="64" y="570" width="1072" height="84" rx="10" fill="#0d1117" stroke="#da3633" stroke-width="1.5"/>
    <rect x="64" y="570" width="5" height="84" rx="2.5" fill="#f85149"/>
    <text x="96" y="604" class="mono" font-size="19" font-weight="700" fill="#ff7b72">LEAVE OPEN</text>
    <text x="96" y="634" class="sans" font-size="19" fill="#8b949e">Writable by design, so ordinary <tspan class="mono" fill="#adbac7">git config</tspan> keeps working.</text>
    <text x="1108" y="598" class="mono" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="end">cplt (Linux) &#183; agent-safehouse &#183; the long tail</text>
    <text x="1108" y="628" class="sans" font-size="17" fill="#6e7681" text-anchor="end">cplt documents it as a residual</text>
  </g>
</svg>
