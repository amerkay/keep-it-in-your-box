<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 398" width="1200" height="398" role="img" aria-labelledby="t3 d3">
  <title id="t3">How rare are the controls kib leads on, across 30 surveyed agent sandboxes</title>
  <desc id="d3">Bar chart of how many of the 30 surveyed projects implement each of the three controls kib leads on. Clipboard mediation 0 of 30. In-project secret redaction 6 of 30. Host-executed config guard 10 of 30. kib has all three. The two positions kib declines by design, a VM-class boundary and default-deny egress, are discussed in the document rather than charted here.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="grid3" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="398" fill="url(#bg3)"/>
  <rect width="1200" height="398" fill="url(#grid3)"/>

  <text x="64" y="72" class="mono" font-size="15" letter-spacing="3.2" fill="#58a6ff">ADOPTION ACROSS THE FIELD</text>
  <text x="62" y="118" class="sans" font-size="34" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">How rare is each control <tspan fill="#8b949e" font-weight="400">kib leads on?</tspan></text>

  <!-- axis -->
  <g class="mono" font-size="15" fill="#6e7681" text-anchor="middle">
    <text x="430" y="164">0</text>
    <text x="616" y="164">10</text>
    <text x="802" y="164">20</text>
    <text x="988" y="164">30</text>
  </g>
  <g stroke="#8b949e" stroke-opacity="0.10" stroke-width="1">
    <path d="M430 174 V310"/><path d="M616 174 V310"/><path d="M802 174 V310"/><path d="M988 174 V310"/>
  </g>

  <!-- labels -->
  <g class="sans" font-size="20" fill="#adbac7" text-anchor="end">
    <text x="402" y="209">Clipboard mediation</text>
    <text x="402" y="253">In-project secret redaction</text>
    <text x="402" y="297">Host-executed config guard</text>
  </g>

  <!-- tracks -->
  <g fill="#161b22">
    <rect x="430" y="191" width="558" height="22" rx="11"/>
    <rect x="430" y="235" width="558" height="22" rx="11"/>
    <rect x="430" y="279" width="558" height="22" rx="11"/>
  </g>

  <!-- bars: 18.6 units per project -->
  <g fill="#1f6feb">
    <rect x="430" y="235" width="112" height="22" rx="11"/>
    <rect x="430" y="279" width="186" height="22" rx="11"/>
  </g>
  <!-- zero marker -->
  <rect x="430" y="191" width="4" height="22" rx="2" fill="#30363d"/>

  <!-- counts -->
  <g class="mono" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="end">
    <text x="1046" y="209">0</text>
    <text x="1046" y="253">6</text>
    <text x="1046" y="297">10</text>
  </g>

  <!-- kib verdict chips -->
  <g class="mono" font-size="16" font-weight="700" text-anchor="middle">
    <g>
      <rect x="1058" y="189" width="78" height="26" rx="13" fill="#0f2417" stroke="#238636" stroke-width="1.4"/>
      <text x="1097" y="207" fill="#56d364">kib &#10003;</text>
    </g>
    <g>
      <rect x="1058" y="233" width="78" height="26" rx="13" fill="#0f2417" stroke="#238636" stroke-width="1.4"/>
      <text x="1097" y="251" fill="#56d364">kib &#10003;</text>
    </g>
    <g>
      <rect x="1058" y="277" width="78" height="26" rx="13" fill="#0f2417" stroke="#238636" stroke-width="1.4"/>
      <text x="1097" y="295" fill="#56d364">kib &#10003;</text>
    </g>
  </g>

  <path d="M64 330 H1136" stroke="#21262d" stroke-width="1.5"/>
  <text x="64" y="354" class="mono" font-size="16" fill="#6e7681">Counts come from primary sources, read per project.</text>
  <text x="64" y="378" class="mono" font-size="16" fill="#6e7681">The two positions kib declines by design are priced in the text, not charted.</text>
</svg>
