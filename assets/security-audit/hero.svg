<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Security Audit of the cc Claude Code Docker sandbox. Verdict: the container holds, but the git-config guard is breached. 4 critical findings, 8 high findings, 6 host-RCE paths, 0 container escapes.">
  <title>Security Audit — cc Claude Code Docker sandbox: container held, git-config guard breached (4 critical, 8 high, 6 host-RCE paths, 0 container escapes)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2942" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0a0e17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb4a8"/>
      <stop offset="1" stop-color="#ff5c57"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <rect width="780" height="330" fill="url(#glow)"/>

  <!-- ── left: title block ────────────────────────────────────────────── -->
  <text x="64" y="80" class="mono" font-size="18" letter-spacing="4" fill="#58a6ff">cc &#183; CLAUDE CODE DOCKER SANDBOX</text>

  <text x="61" y="166" class="sans" font-size="82" font-weight="800" fill="#e6edf3" letter-spacing="-1">Security Audit</text>

  <text x="64" y="212" class="sans" font-size="25" fill="#adbac7">Can a malicious webpage or repo escape and run code on your host?</text>

  <!-- verdict pills -->
  <g class="mono" font-size="19" font-weight="700">
    <rect x="64" y="242" width="280" height="44" rx="22" fill="#12271a" stroke="#238636" stroke-width="1.5"/>
    <circle cx="91" cy="264" r="6.5" fill="#3fb950"/>
    <text x="108" y="270" fill="#56d364">CONTAINER &#8212; HELD</text>

    <rect x="356" y="242" width="346" height="44" rx="22" fill="#2a1416" stroke="#da3633" stroke-width="1.5"/>
    <path d="M381 256 l13 15 M394 256 l-13 15" stroke="#ff7b72" stroke-width="3" stroke-linecap="round"/>
    <text x="404" y="270" fill="#ff7b72">GIT-CONFIG GUARD &#8212; BREACHED</text>
  </g>

  <text x="64" y="316" class="sans" font-size="20" fill="#8b949e">The escape isn&#8217;t the kernel &#8212; it&#8217;s the config the host runs on your next <tspan class="mono" fill="#adbac7">git status</tspan>.</text>

  <!-- ── right: shield + crack motif ──────────────────────────────────── -->
  <g transform="translate(925 32)">
    <path d="M115 6 L214 40 L214 150 C214 214 168 250 115 274 C62 250 16 214 16 150 L16 40 Z"
          fill="#0f1a2c" stroke="#30475f" stroke-width="2.5"/>
    <path d="M115 6 L214 40 L214 150 C214 214 168 250 115 274 C62 250 16 214 16 150 L16 40 Z"
          fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-opacity="0.15"/>

    <text x="52" y="118" class="mono" font-size="13" fill="#3fb950" transform="rotate(-90 52 118)">SECCOMP &#183; CAP-DROP</text>

    <text x="86" y="150" class="mono" font-size="15" fill="#8b949e">.git/</text>
    <text x="80" y="170" class="mono" font-size="15" fill="#ff7b72">config</text>

    <path d="M150 20 L128 70 L150 96 L120 150 L150 176 L128 232 L150 262"
          fill="none" stroke="url(#crack)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M150 96 L196 108 M120 150 L206 158 M150 176 L200 200"
          fill="none" stroke="#ff5c57" stroke-width="2.5" stroke-opacity="0.75" stroke-linecap="round"/>

    <circle cx="222" cy="158" r="4" fill="#ff5c57"/>
    <circle cx="238" cy="150" r="3" fill="#ff5c57" fill-opacity="0.7"/>
    <circle cx="252" cy="164" r="2.5" fill="#ff5c57" fill-opacity="0.5"/>
    <text x="150" y="300" class="mono" font-size="15" fill="#ff7b72" text-anchor="middle">&#8594; HOST RCE</text>
  </g>

  <!-- ── bottom: scoreboard strip ─────────────────────────────────────── -->
  <line x1="0" y1="348" x2="1200" y2="348" stroke="#21262d" stroke-width="1"/>
  <g class="sans" text-anchor="middle">
    <!-- cell 1 -->
    <text x="150" y="404" class="mono" font-size="52" font-weight="800" fill="#ff5c57">4</text>
    <text x="150" y="428" font-size="16" letter-spacing="2" fill="#8b949e">CRITICAL</text>
    <!-- cell 2 -->
    <text x="450" y="404" class="mono" font-size="52" font-weight="800" fill="#f2cc60">8</text>
    <text x="450" y="428" font-size="16" letter-spacing="2" fill="#8b949e">HIGH</text>
    <!-- cell 3 -->
    <text x="750" y="404" class="mono" font-size="52" font-weight="800" fill="#ff7b72">6</text>
    <text x="750" y="428" font-size="16" letter-spacing="2" fill="#8b949e">HOST-RCE PATHS</text>
    <!-- cell 4 -->
    <text x="1050" y="404" class="mono" font-size="52" font-weight="800" fill="#3fb950">0</text>
    <text x="1050" y="428" font-size="16" letter-spacing="2" fill="#8b949e">CONTAINER ESCAPES</text>
  </g>
  <line x1="300" y1="368" x2="300" y2="432" stroke="#21262d" stroke-width="1"/>
  <line x1="600" y1="368" x2="600" y2="432" stroke="#21262d" stroke-width="1"/>
  <line x1="900" y1="368" x2="900" y2="432" stroke="#21262d" stroke-width="1"/>
</svg>
